name: Persona16

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

targets:
  Persona16:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Persona16/App
      - path: Persona16/Domain
      - path: Persona16/Networking
      - path: Persona16/Persistence
        optional: true
      - path: Persona16/Features
        optional: true
      - path: Persona16/DesignSystem
        optional: true
      - path: Persona16/Resources/Assets.xcassets
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: Persona16
        INFOPLIST_FILE: Persona16/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Validate Release API Base URL
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION:-}" != "Release" ]; then
            exit 0
          fi

          api_base_url="${PERSONA16_API_BASE_URL:-}"
          normalized_api_base_url="$(printf '%s' "$api_base_url" | tr '[:upper:]' '[:lower:]')"
          case "$normalized_api_base_url" in
            ""|*".invalid"*)
              echo "error: Release requires PERSONA16_API_BASE_URL to be set to the production HTTPS endpoint."
              exit 1
              ;;
          esac

          case "$normalized_api_base_url" in
            https://?*) ;;
            *)
              echo "error: Release PERSONA16_API_BASE_URL must use HTTPS."
              exit 1
              ;;
          esac

  Persona16Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Persona16Tests
    dependencies:
      - target: Persona16
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.persona16.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete

  Persona16UITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Persona16UITests
    dependencies:
      - target: Persona16
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.persona16.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Persona16:
    build:
      targets:
        Persona16: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: Persona16Tests
          parallelizable: true
        - name: Persona16UITests
          parallelizable: false
    archive:
      config: Release
